<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habitat Studio — IR Manager</title>
  <meta name="description" content="IR Manager Habitat Studio Next — real-time 3D planner for reptile breeding facilities.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23121315'/%3E%3Cpath d='M4 11V6l4-2.5L12 6v5' fill='none' stroke='%23e8913a' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header id="toolbar" class="toolbar"></header>
    <div class="workspace">
      <aside id="library" class="panel panel-left"></aside>
      <main id="viewport" class="viewport">
        <div class="loading" id="loading">
          <div class="loading-card">
            <div class="brand"><span class="brand-mark"></span><span class="brand-name">IR MANAGER</span><span class="brand-sep"></span><span class="brand-app">Habitat Studio</span></div>
            <div class="loading-bar"><i id="loading-fill"></i></div>
            <div class="loading-text" id="loading-text">Initialising…</div>
          </div>
        </div>
      </main>
      <aside id="inspector" class="panel panel-right"></aside>
    </div>
  </div>
  <noscript>Habitat Studio requires JavaScript and WebGL 2.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
